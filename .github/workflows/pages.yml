name: Publish Adeshpustika

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out catalogue and files
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF text and Nepali OCR tools
        run: |
          python -m pip install 'PyMuPDF>=1.26,<2'
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-nep tesseract-ocr-eng
      - name: Generate catalogue from Files folder
        run: python3 scripts/build-index.py --site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish public site
        id: deployment
        uses: actions/deploy-pages@v4

